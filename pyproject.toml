[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ux-fnbase"
version = "0.1.0"
description = "Function database: pure-function queries/mutations, read-set tracking, ACID writes, live subscriptions"
keywords = ["reactive", "database", "subscriptions", "read-set", "mvcc", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ux-fnbase contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6", "fastapi", "uvicorn[standard]", "httpx"]
playground = ["fastapi", "uvicorn[standard]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "playground/tests"]
